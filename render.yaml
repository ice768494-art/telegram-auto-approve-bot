services:
  - type: web
    name: telegram-auto-approver
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        value: "255448871"

      - key: AUTO_APPROVE
        value: "true"

      - key: WELCOME_MESSAGE
        value: |-
          <blockquote>
          🎉 <b>WELCOME, {first_name}!</b> 🎉

          ━━━━━━━━━━━━━━━━━━

          ✅ <b>YOUR JOIN REQUEST HAS BEEN APPROVED!</b>

          🚀 You're now officially part of our amazing community!

          💫 Enjoy the latest anime updates, episodes & exciting content.

          ━━━━━━━━━━━━━━━━━━

          🤖 <b>Powered By:</b> @AnimeNetworkTamil

          💎 <i>Advanced Auto Request Approval Bot</i>
          </blockquote>

      - key: START_MESSAGE
        value: |-
          <blockquote>
          👋 <b>HEY, {first_name}!</b>

          🌟 Welcome to our Advanced Auto Request Approval Bot.

          ⚡ Fast • Smart • Automatic

          🤖 <b>Powered By:</b> @AnimeNetworkTamil
          </blockquote>
